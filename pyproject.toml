[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlcard-gin-rummy-bot"
version = "0.1.0"
description = "Autonomous High-Performance RLCard Gin Rummy Bot with Vectorized PPO, Multi-Agent Self-Play, and PyTorch CUDA Acceleration"
readme = "README.md"
authors = [
    { name = "Reinforcement Learning Team", email = "team@antigravity.ai" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "reinforcement-learning",
    "gin-rummy",
    "ppo",
    "self-play",
    "rlcard",
    "pytorch",
    "cuda",
    "game-ai",
    "github-mcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games"
]
dependencies = [
    "torch>=2.0.0",
    "rlcard>=1.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "black>=23.7.0",
    "isort>=5.12.0"
]

[project.scripts]
gin-train = "scripts.train:main"
gin-benchmark = "scripts.benchmark:main"
gin-mcp = "scripts.run_mcp_workflow:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gin_rummy*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
